name: Linux checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: xvfb-run -a -s "-screen 0 1920x1080x24" npm run test:e2e
      - run: npm audit --omit=dev
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-test-results
          path: test-results/
